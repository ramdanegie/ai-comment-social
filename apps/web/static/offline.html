<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#eaf0f7">
  <title>Anda sedang offline · Replyra</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: #172c46; background: #eaf0f7; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px; background: radial-gradient(ellipse at top left, #afd7ff88, transparent 70%); }
    main { width: min(100%, 420px); padding: 40px 28px; text-align: center; border: 1px solid #ffffffcc; border-radius: 32px; background: #ffffff88; box-shadow: 0 20px 60px #19396112; }
    svg { width: 48px; height: 48px; color: #c5221f; }
    h1 { font-size: 24px; letter-spacing: -.04em; }
    p { line-height: 1.6; color: #52647c; }
    a { display: inline-block; margin-top: 12px; padding: 14px 24px; border-radius: 24px; color: white; background: #ea4335; text-decoration: none; font-weight: 600; }
    a:focus-visible { outline: 3px solid #ea4335; outline-offset: 4px; }
    @media (prefers-color-scheme: dark) {
      :root { color-scheme: dark; color: #edf5ff; background: #101a2b; }
      body { background: radial-gradient(ellipse at top left, #164a7888, transparent 70%); }
      main { background: #20324b99; border-color: #ffffff22; }
      p { color: #b7c9dd; } svg { color: #ff9f96; }
    }
  </style>
</head>
<body>
  <main>
    <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m2 2 20 20M8.5 16.5a5 5 0 0 1 7 0M12 20h.01M5 12a10 10 0 0 1 5-2M16 10.5a10 10 0 0 1 3 1.5M2 8a16 16 0 0 1 4-2M10 4.2A16 16 0 0 1 22 8"/></svg>
    <h1>Anda sedang offline</h1>
    <p>Hubungkan kembali ke internet untuk melihat komentar terbaru dan melanjutkan aktivitas di Replyra.</p>
    <a href="/dashboard">Coba lagi</a>
  </main>
</body>
</html>
